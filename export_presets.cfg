[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/vfx/remaining-native/*.json,assets/vfx/native-burst/*.json,scripts/data/sentience_story_scenes.json,assets/sentience/presentation.json,assets/*/material-profiles.json,assets/*/*vfx-map.json,assets/phoenix-fire-sword/vfx/source.json,assets/motions/fuhua-face-atlas.json,assets/materials/native-character-profiles.json,assets/stage/native-props/original-materials.json,assets/stage/native-props/mountain-temple-materials.json,assets/audio/voice/manifest.json"
exclude_filter="tools/*,tests/*,build/*,*.md,*.txt,scripts/*_check.gd,scripts/*_inspect.gd,assets/ui/*_check.gd,assets/vfx/*_check.gd,assets/vfx/*-proof.png,assets/garuda/*,assets/sentience/combat-motions.res,assets/azure-skin/Avatar.fbx,assets/*/source-manifest.json"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=false
html/custom_html_shell="res://web-shell.html"
html/head_include="<meta name=\"theme-color\" content=\"#e8f1f7\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
